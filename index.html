function delPay(id){const p=S.payments.find(x=>x.id==id),d=S[p.t=='in'?'invoices':'bills'].find(x=>x.no==p.doc);if(d)d.paid=Math.max(0,d.paid-p.amount);S.payments=S.payments.filter(x=>x.id!=id);save();render()}

<div class="r bt"><div style="width:58%;border-right:1px solid #000"><div style="padding:4px 6px">Terms &amp; Condition:<br>${terms}</div><div class="bt" style="padding:18px 6px 4px">Receiver's Sign.</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding:4px 6px"><b style="margin-top:46px">For, ${(o.name||'').toUpperCase()}</b><span>Authorised Sign.</span></div></div></div></div></div>`}
